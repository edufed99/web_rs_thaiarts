# Alembic configuration for the Thai Arts Recommender backend.
#
# Run migrations with:
#   cd backend
#   alembic upgrade head
#
# Stamp an existing populated database (one-time) with:
#   alembic stamp head
#
# The DB URL is read at runtime from $RECSYS_DATABASE_URL via env.py, so
# the value below is left blank on purpose.

[alembic]
script_location = migrations
prepend_sys_path = .
timezone = UTC
truncate_slug_length = 40
revision_environment = false
sourceless = false
version_path_separator = os

# sqlalchemy.url is intentionally empty — env.py reads RECSYS_DATABASE_URL.
sqlalchemy.url =

[post_write_hooks]

[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARN
handlers = console
qualname =

[logger_sqlalchemy]
level = WARN
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S
