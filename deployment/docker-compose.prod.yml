# Production Docker Compose definition for Thai Arts Recommender.
# Runs PostgreSQL 18, the FastAPI Private Model Service, and the Next.js
# Application Backend (the only public API surface, issues #10 + #11).
# Pulls public images from Docker Hub (pichaya5502/...).
# The public reverse proxy is nginx + certbot (see deployment/nginx/), which
# publishes host 80/443 and proxies to the Next.js frontend over the internal
# Docker network. Next.js itself keeps its 127.0.0.1:3000 publish as the
# IIS-rollback path. PostgreSQL and the Private Model Service have no
# host-published ports — they are reachable only over the internal Docker
# network (issue #11 network boundary).
# No source code is required on the server — runs only from pre-built images.
name: thaiarts-recommender

services:
  # PostgreSQL is an internal service only (issue #11): no host-published
  # port. The Application Backend and the migrate tool reach it over the
  # internal network; backups run inside the container via `docker compose
  # exec` (see deployment/release/backup-and-migrate.ps1).
  postgres:
    image: postgres:18
    container_name: thaiarts-postgres
    restart: always
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-postgres}
      POSTGRES_DB: ${POSTGRES_DB:-web_rs_thaiarts}
    volumes:
      - postgres_data:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-postgres} -d ${POSTGRES_DB:-web_rs_thaiarts}"]
      interval: 5s
      timeout: 5s
      retries: 10

  # Private Model Service — the ONLY FastAPI process (issue #10). It is
  # database-free, serves no public endpoints, and is reachable only by the
  # Next.js Application Backend over the internal Docker network with the
  # Internal Service Credential. It deliberately does NOT load the shared
  # .env (which carries POSTGRES_* credentials): every variable it reads is
  # declared explicitly below, so the container provably has no database or
  # media configuration (issue #11 boundary test).
  backend:
    image: pichaya5502/web_rs_thaiarts-backend:latest
    pull_policy: always
    container_name: thaiarts-backend
    restart: always
    environment:
      RECSYS_ARTIFACT_DIR: /app/artifacts
      RECSYS_INTERNAL_SERVICE_SECRET: ${MODEL_SERVICE_SHARED_SECRET:-}
      # Recommender runtime flags (defaults mirror backend/app/core/config.py).
      RECSYS_E5_ENABLED: ${RECSYS_E5_ENABLED:-0}
      RECSYS_PRELOAD_E5: ${RECSYS_PRELOAD_E5:-0}
      RECSYS_HYBRID_ALPHA: ${RECSYS_HYBRID_ALPHA:-0.7}
      RECSYS_CBF_KEYWORD_BOOST: ${RECSYS_CBF_KEYWORD_BOOST:-0.05}
      RECSYS_ITEMKNN_K: ${RECSYS_ITEMKNN_K:-10}
      RECSYS_ITEMKNN_SHRINK: ${RECSYS_ITEMKNN_SHRINK:-50.0}
      RECSYS_POSITIVE_THRESHOLD: ${RECSYS_POSITIVE_THRESHOLD:-4}
      RECSYS_NEGATIVE_PENALTY_ALPHA: ${RECSYS_NEGATIVE_PENALTY_ALPHA:-1.0}
      RECSYS_MIN_CANDS: ${RECSYS_MIN_CANDS:-10}
      RECSYS_MAX_CANDS: ${RECSYS_MAX_CANDS:-}
    expose:
      - "8001"
    healthcheck:
      test: ["CMD-SHELL", "curl -f -H \"Authorization: Bearer $$RECSYS_INTERNAL_SERVICE_SECRET\" http://127.0.0.1:8001/internal/v1/health"]
      interval: 10s
      timeout: 5s
      retries: 5

  frontend:
    image: pichaya5502/web_rs_thaiarts-frontend:latest
    pull_policy: always
    container_name: thaiarts-frontend
    restart: always
    depends_on:
      backend:
        condition: service_healthy
      postgres:
        condition: service_healthy
    env_file:
      - .env
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER:-postgres}:${POSTGRES_PASSWORD:-postgres}@postgres:5432/${POSTGRES_DB:-web_rs_thaiarts}
      MEDIA_STORE_ROOT: /app/data/uploads
      PRIVATE_MODEL_SERVICE_URL: http://backend:8001
      MODEL_SERVICE_SHARED_SECRET: ${MODEL_SERVICE_SHARED_SECRET:-}
    volumes:
      - uploads_data:/app/data/uploads
    ports:
      - "127.0.0.1:3000:3000"

  # Public reverse proxy (replaced IIS W3SVC). nginx terminates HTTPS with a
  # Let's Encrypt cert managed by certbot, and proxies every path — pages and
  # /api/* — to the Next.js frontend over the internal Docker network. The
  # reload loop in `command` sends SIGHUP every 12h so renewed certs are
  # picked up without a restart. See deployment/nginx/README.md.
  nginx:
    image: nginx:1.27-alpine
    container_name: thaiarts-nginx
    restart: always
    depends_on:
      - frontend
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - ./nginx/conf.d:/etc/nginx/conf.d:ro
      - certbot_etc:/etc/letsencrypt
      - certbot_webroot:/var/www/certbot
    command: /bin/sh -c "while :; do sleep 12h & wait $${!}; nginx -s reload; done & nginx -g 'daemon off;'"

  # Let's Encrypt cert manager. Shares the certbot_etc + certbot_webroot
  # volumes with nginx. The renew loop runs `certbot renew --quiet` every 12h
  # (webroot plugin). For first-time issuance run a one-shot `docker compose
  # run --rm --entrypoint certbot certbot certonly --webroot …` (see
  # deployment/nginx/README.md) — this service is only the renewal loop.
  certbot:
    image: certbot/certbot:latest
    container_name: thaiarts-certbot
    restart: unless-stopped
    volumes:
      - certbot_etc:/etc/letsencrypt
      - certbot_webroot:/var/www/certbot
    entrypoint: sh -c "trap exit TERM; while :; do certbot renew --quiet; sleep 12h & wait $${!}; done;"

  # One-shot migration/seed/verify tool (issue #11): runs the compiled
  # TypeORM CLI against the internal PostgreSQL. `migration:verify` fails the
  # run when any migration is still pending, so a release can never proceed
  # with an unverified schema.
  migrate:
    image: pichaya5502/web_rs_thaiarts-frontend:latest
    pull_policy: always
    profiles: ["tools"]
    depends_on:
      postgres:
        condition: service_healthy
    env_file:
      - .env
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER:-postgres}:${POSTGRES_PASSWORD:-postgres}@postgres:5432/${POSTGRES_DB:-web_rs_thaiarts}
    restart: "no"
    command: ["sh", "-c", "node .db-dist/cli.js migration:run && node .db-dist/cli.js seed && node .db-dist/cli.js migration:verify"]

volumes:
  postgres_data:
    name: thaiarts_postgres_data
  uploads_data:
    name: thaiarts_uploads_data
  certbot_etc:
    name: thaiarts_certbot_etc
  certbot_webroot:
    name: thaiarts_certbot_webroot
