# Production Docker Compose definition for Thai Arts Recommender.
# Runs PostgreSQL 18, the FastAPI Private Model Service, and the Next.js
# Application Backend (the only public API surface, issue #10).
# Pulls public images from Docker Hub (pichaya5502/...).
# Exposes internal ports on 127.0.0.1 for reverse proxy (IIS / Nginx / Caddy).
# No source code is required on the server — runs only from pre-built images.
name: thaiarts-recommender

services:
  postgres:
    image: postgres:18
    container_name: thaiarts-postgres
    restart: always
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-postgres}
      POSTGRES_DB: ${POSTGRES_DB:-web_rs_thaiarts}
    volumes:
      - postgres_data:/var/lib/postgresql
    ports:
      - "127.0.0.1:5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-postgres} -d ${POSTGRES_DB:-web_rs_thaiarts}"]
      interval: 5s
      timeout: 5s
      retries: 10

  # Private Model Service — the ONLY FastAPI process (issue #10). It is
  # database-free, serves no public endpoints, and is reachable only by the
  # Next.js Application Backend over the internal Docker network with the
  # Internal Service Credential.
  backend:
    image: pichaya5502/web_rs_thaiarts-backend:latest
    pull_policy: always
    container_name: thaiarts-backend
    restart: always
    env_file:
      - .env
    environment:
      RECSYS_ARTIFACT_DIR: /app/artifacts
      RECSYS_INTERNAL_SERVICE_SECRET: ${MODEL_SERVICE_SHARED_SECRET:-}
    expose:
      - "8001"
    healthcheck:
      test: ["CMD-SHELL", "curl -f -H \"Authorization: Bearer $$RECSYS_INTERNAL_SERVICE_SECRET\" http://127.0.0.1:8001/internal/v1/health"]
      interval: 10s
      timeout: 5s
      retries: 5

  frontend:
    image: pichaya5502/web_rs_thaiarts-frontend:latest
    pull_policy: always
    container_name: thaiarts-frontend
    restart: always
    depends_on:
      backend:
        condition: service_healthy
      postgres:
        condition: service_healthy
    env_file:
      - .env
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER:-postgres}:${POSTGRES_PASSWORD:-postgres}@postgres:5432/${POSTGRES_DB:-web_rs_thaiarts}
      MEDIA_STORE_ROOT: /app/data/uploads
      PRIVATE_MODEL_SERVICE_URL: http://backend:8001
      MODEL_SERVICE_SHARED_SECRET: ${MODEL_SERVICE_SHARED_SECRET:-}
    volumes:
      - uploads_data:/app/data/uploads
    ports:
      - "127.0.0.1:3000:3000"

  migrate:
    image: pichaya5502/web_rs_thaiarts-frontend:latest
    pull_policy: always
    profiles: ["tools"]
    depends_on:
      postgres:
        condition: service_healthy
    env_file:
      - .env
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER:-postgres}:${POSTGRES_PASSWORD:-postgres}@postgres:5432/${POSTGRES_DB:-web_rs_thaiarts}
    restart: "no"
    command: ["sh", "-c", "node .db-dist/cli.js migration:run && node .db-dist/cli.js seed"]

volumes:
  postgres_data:
    name: thaiarts_postgres_data
  uploads_data:
    name: thaiarts_uploads_data
