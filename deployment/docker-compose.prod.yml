# Production Docker Compose definition for Thai Arts Recommender.
# Runs PostgreSQL 18, FastAPI Backend, and Next.js Frontend.
# Pulls public images from Docker Hub (pichaya5502/...).
# Exposes internal ports on 127.0.0.1 for reverse proxy (IIS / Nginx / Caddy).
# No source code is required on the server — runs only from pre-built images.
name: thaiarts-recommender

services:
  postgres:
    image: postgres:18
    container_name: thaiarts-postgres
    restart: always
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-postgres}
      POSTGRES_DB: ${POSTGRES_DB:-web_rs_thaiarts}
    volumes:
      - postgres_data:/var/lib/postgresql
    ports:
      - "127.0.0.1:5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-postgres} -d ${POSTGRES_DB:-web_rs_thaiarts}"]
      interval: 5s
      timeout: 5s
      retries: 10

  backend:
    image: pichaya5502/web_rs_thaiarts-backend:latest
    pull_policy: always
    container_name: thaiarts-backend
    restart: always
    depends_on:
      postgres:
        condition: service_healthy
    env_file:
      - .env
    environment:
      RECSYS_DATABASE_URL: postgresql+psycopg://${POSTGRES_USER:-postgres}:${POSTGRES_PASSWORD:-postgres}@postgres:5432/${POSTGRES_DB:-web_rs_thaiarts}
      RECSYS_DB_ENABLED: "1"
      RECSYS_ARTIFACT_DIR: /app/artifacts
      RECSYS_UPLOAD_DIR: /app/data/uploads
    volumes:
      - uploads_data:/app/data/uploads
    ports:
      - "127.0.0.1:8001:8001"
    healthcheck:
      test: ["CMD", "curl", "-f", "http://127.0.0.1:8001/health"]
      interval: 10s
      timeout: 5s
      retries: 5

  frontend:
    image: pichaya5502/web_rs_thaiarts-frontend:latest
    pull_policy: always
    container_name: thaiarts-frontend
    restart: always
    depends_on:
      backend:
        condition: service_healthy
    env_file:
      - .env
    ports:
      - "127.0.0.1:3000:3000"

volumes:
  postgres_data:
    name: thaiarts_postgres_data
  uploads_data:
    name: thaiarts_uploads_data
