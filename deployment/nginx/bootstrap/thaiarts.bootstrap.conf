# Bootstrap (init-only) site config — used ONLY until the Let's Encrypt cert
# has been issued. Loaded from deployment/nginx/conf.d/ on the FIRST nginx
# start (before certbot has produced /etc/letsencrypt/live/.../fullchain.pem).
#
# Binds only HTTP :80 (no 443, no HTTPS redirect), serves the ACME challenge
# webroot so certbot --webroot can validate, and proxies everything else to
# the Next.js frontend over plain HTTP so the site is reachable during issuance.
#
# Cutover: once the cert exists, move deployment/nginx/conf.d/thaiarts.conf
# into conf.d/ and DELETE this bootstrap file, then
# `docker exec thaiarts-nginx nginx -s reload` to bind 443 + redirect 80.

server {
    listen 80;
    listen [::]:80;
    server_name thaiperform.fed.bpi.ac.th;

    # Let's Encrypt webroot validation (certbot --webroot -w /var/www/certbot).
    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    # Everything else → Next.js over the internal network (HTTP, no redirect
    # yet — HTTPS is not available until the cert is issued).
    location / {
        proxy_pass http://frontend:3000;

        proxy_http_version 1.1;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host  $host;

        proxy_connect_timeout 60s;
        proxy_send_timeout    300s;
        proxy_read_timeout    300s;
    }
}