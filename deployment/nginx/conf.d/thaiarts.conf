# Steady-state site config for thaiperform — loaded AFTER the Let's Encrypt
# cert has been issued. Replaces deployment/nginx/bootstrap/thaiarts.bootstrap.conf
# (move this file into conf.d/ and remove the bootstrap file, then
# `docker exec thaiarts-nginx nginx -s reload`).
#
# HTTP (80): serves /.well-known/acme-challenge/ from the certbot webroot for
# renewals, and 301-redirects everything else to https.
# HTTPS (443, http2): serves the site with the Let's Encrypt cert, HSTS, and
# proxies every path to the Next.js Application Backend (frontend:3000).

# --- HTTP :80 — ACME challenge + redirect to HTTPS ---------------------------
server {
    listen 80;
    listen [::]:80;
    server_name thaiperform.fed.bpi.ac.th;

    # Let's Encrypt webroot validation (certbot --webroot -w /var/www/certbot).
    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    # Everything else → HTTPS (permanent).
    location / {
        return 301 https://$host$request_uri;
    }
}

# --- HTTPS :443 — public site, proxied to Next.js ----------------------------
server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    server_name thaiperform.fed.bpi.ac.th;

    # Let's Encrypt cert (shared certbot_etc volume, mounted at /etc/letsencrypt).
    ssl_certificate     /etc/letsencrypt/live/thaiperform.fed.bpi.ac.th/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/thaiperform.fed.bpi.ac.th/privkey.pem;

    # Modern TLS: 1.2 + 1.3 only. Let's Encrypt intermediates are trusted by
    # all evergreen clients, so no legacy chains needed.
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers HIGH:!aNULL:!MD5;
    ssl_prefer_server_ciphers on;
    ssl_session_cache shared:SSL:10m;
    ssl_session_timeout 1d;

    # HSTS — once HTTPS is confirmed stable, this pins clients to it for a year.
    # (Remove if you ever need to serve HTTP intentionally.)
    add_header Strict-Transport-Security "max-age=31536000" always;

    # ACME challenge is also reachable over HTTPS for renewal robustness.
    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    # Next.js serves both pages and /api/* on the same port (App Router).
    # Proxy every path to the frontend container on the internal network.
    location / {
        proxy_pass http://frontend:3000;

        proxy_http_version 1.1;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host  $host;

        # WebSocket / Next.js HMR not needed in prod, but harmless.
        proxy_set_header Upgrade           $http_upgrade;
        proxy_set_header Connection        $connection_upgrade;

        proxy_connect_timeout 60s;
        proxy_send_timeout    300s;
        proxy_read_timeout    300s;
    }
}

# $connection_upgrade is undefined for plain HTTP requests; map it so the
# Upgrade/Connection headers above don't warn on reload.
map $http_upgrade $connection_upgrade {
    default upgrade;
    ''      close;
}