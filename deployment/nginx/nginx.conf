# nginx main config — Thai Arts Recommender public reverse proxy.
# Loaded as /etc/nginx/nginx.conf inside the `nginx:1.27-alpine` container
# (see deployment/docker-compose.prod.yml). Site blocks live in
# /etc/nginx/conf.d/*.conf (mounted from deployment/nginx/conf.d).
#
# nginx terminates public HTTPS with a Let's Encrypt cert (certbot-managed,
# shared `certbot_etc` volume) and proxies everything — pages and /api/* — to
# the Next.js Application Backend over the internal Docker network
# (`frontend:3000`). The Private Model Service (backend:8001) and PostgreSQL
# are never reached by nginx; they stay internal-only (issue #11).

user  nginx;
worker_processes  auto;

error_log  /var/log/nginx/error.log warn;
pid        /var/run/nginx.pid;

events {
    worker_connections  1024;
}

http {
    include       /etc/nginx/mime.types;
    default_type  application/octet-stream;

    # Match the legacy IIS web.config limit (110 MB) so the 5 MB cover-image
    # and 100 MB video admin uploads pass through the proxy.
    client_max_body_size 110m;

    log_format  main  '$remote_addr - $remote_user [$time_local] "$request" '
                      '$status $body_bytes_sent "$http_referer" '
                      '"$http_user_agent"';

    access_log  /var/log/nginx/access.log  main;

    sendfile        on;
    #tcp_nopush     on;
    keepalive_timeout  65;

    # Gzip text payloads (Next.js HTML/JS/CSS). Already-compressed assets
    # (images, video) are skipped.
    gzip  on;
    gzip_vary on;
    gzip_proxied any;
    gzip_comp_level 5;
    gzip_min_length 256;
    gzip_types
        text/plain
        text/css
        text/xml
        application/json
        application/javascript
        application/xml+rss
        application/atom+xml
        image/svg+xml;

    # The reload loop in the compose `command` sends SIGHUP every 12h so nginx
    # picks up renewed Let's Encrypt certs without restarting.
    include /etc/nginx/conf.d/*.conf;
}