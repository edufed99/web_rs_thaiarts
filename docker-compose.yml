# docker-compose.yml — Local Development & Build Configuration
# Builds and runs PostgreSQL 18, the FastAPI Private Model Service, and the
# Next.js Application Backend (the only public API surface, issue #10).
name: web_rs_thaiarts

services:
  postgres:
    image: postgres:18
    container_name: web_rs_thaiarts-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-postgres}
      POSTGRES_DB: ${POSTGRES_DB:-web_rs_thaiarts}
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-postgres} -d ${POSTGRES_DB:-web_rs_thaiarts}"]
      interval: 5s
      timeout: 5s
      retries: 10

  # Private Model Service — the ONLY FastAPI process (issue #10). It is
  # database-free, serves no public endpoints, and is reachable only by the
  # Next.js Application Backend over the internal Docker network with the
  # Internal Service Credential.
  backend:
    image: pichaya5502/web_rs_thaiarts-backend:latest
    build:
      context: .
      dockerfile: backend/Dockerfile
    container_name: web_rs_thaiarts-backend
    restart: unless-stopped
    environment:
      RECSYS_ARTIFACT_DIR: /app/artifacts
      RECSYS_INTERNAL_SERVICE_SECRET: ${MODEL_SERVICE_SHARED_SECRET:-dev-secret-12345}
    expose:
      - "8001"
    healthcheck:
      test: ["CMD-SHELL", "curl -f -H \"Authorization: Bearer $$RECSYS_INTERNAL_SERVICE_SECRET\" http://127.0.0.1:8001/internal/v1/health"]
      interval: 10s
      timeout: 5s
      retries: 5

  frontend:
    image: pichaya5502/web_rs_thaiarts-frontend:latest
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: web_rs_thaiarts-frontend
    restart: unless-stopped
    depends_on:
      backend:
        condition: service_healthy
      postgres:
        condition: service_healthy
    env_file:
      - ./frontend/.env.local
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER:-postgres}:${POSTGRES_PASSWORD:-postgres}@postgres:5432/${POSTGRES_DB:-web_rs_thaiarts}
      MEDIA_STORE_ROOT: /app/data/uploads
      PRIVATE_MODEL_SERVICE_URL: http://backend:8001
      MODEL_SERVICE_SHARED_SECRET: ${MODEL_SERVICE_SHARED_SECRET:-dev-secret-12345}
      SESSION_COOKIE_SECURE: "0"
      # SMTP fallback is optional; uncomment in frontend/.env.local to enable.
      SMTP_HOST: ${SMTP_HOST:-}
      SMTP_PORT: ${SMTP_PORT:-}
      SMTP_USERNAME: ${SMTP_USERNAME:-}
      SMTP_PASSWORD: ${SMTP_PASSWORD:-}
      SMTP_FROM_EMAIL: ${SMTP_FROM_EMAIL:-}
      SMTP_USE_TLS: ${SMTP_USE_TLS:-}
    volumes:
      - uploads_data:/app/data/uploads
    ports:
      - "3000:3000"

  migrate:
    image: pichaya5502/web_rs_thaiarts-frontend:latest
    build:
      context: ./frontend
      dockerfile: Dockerfile
    profiles: ["tools"]
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER:-postgres}:${POSTGRES_PASSWORD:-postgres}@postgres:5432/${POSTGRES_DB:-web_rs_thaiarts}
    restart: "no"
    command: ["sh", "-c", "node .db-dist/cli.js migration:run && node .db-dist/cli.js seed && node .db-dist/cli.js migration:verify"]

volumes:
  postgres_data:
    name: web_rs_thaiarts_postgres_data
  uploads_data:
    name: web_rs_thaiarts_uploads_data
