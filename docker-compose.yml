# docker-compose.yml — Local Development & Build Configuration
# Builds and runs PostgreSQL 18, FastAPI Backend, and Next.js Frontend.
name: web_rs_thaiarts

services:
  postgres:
    image: postgres:18
    container_name: web_rs_thaiarts-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-postgres}
      POSTGRES_DB: ${POSTGRES_DB:-web_rs_thaiarts}
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-postgres} -d ${POSTGRES_DB:-web_rs_thaiarts}"]
      interval: 5s
      timeout: 5s
      retries: 10

  backend:
    image: pichaya5502/web_rs_thaiarts-backend:latest
    build:
      context: .
      dockerfile: backend/Dockerfile
    container_name: web_rs_thaiarts-backend
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      RECSYS_DATABASE_URL: postgresql+psycopg://${POSTGRES_USER:-postgres}:${POSTGRES_PASSWORD:-postgres}@postgres:5432/${POSTGRES_DB:-web_rs_thaiarts}
      RECSYS_DB_ENABLED: "1"
      RECSYS_ARTIFACT_DIR: /app/artifacts
      RECSYS_UPLOAD_DIR: /app/data/uploads
    volumes:
      - uploads_data:/app/data/uploads
    ports:
      - "8001:8001"
    healthcheck:
      test: ["CMD", "curl", "-f", "http://127.0.0.1:8001/health"]
      interval: 10s
      timeout: 5s
      retries: 5

  model-service:
    image: pichaya5502/web_rs_thaiarts-backend:latest
    build:
      context: .
      dockerfile: backend/Dockerfile
    container_name: web_rs_thaiarts-model-service
    restart: unless-stopped
    environment:
      RECSYS_UVICORN_APP: app.private_main:app
      RECSYS_DB_ENABLED: "0"
      RECSYS_ARTIFACT_DIR: /app/artifacts
      RECSYS_INTERNAL_SERVICE_SECRET: ${MODEL_SERVICE_SHARED_SECRET:-}
    expose:
      - "8001"
    healthcheck:
      test: ["CMD-SHELL", "curl -f -H \"Authorization: Bearer $$RECSYS_INTERNAL_SERVICE_SECRET\" http://127.0.0.1:8001/internal/v1/health"]
      interval: 10s
      timeout: 5s
      retries: 5

  frontend:
    image: pichaya5502/web_rs_thaiarts-frontend:latest
    build:
      context: ./frontend
      dockerfile: Dockerfile
      args:
        MODEL_SERVICE_URL: http://backend:8001
    container_name: web_rs_thaiarts-frontend
    restart: unless-stopped
    depends_on:
      backend:
        condition: service_healthy
      postgres:
        condition: service_healthy
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER:-postgres}:${POSTGRES_PASSWORD:-postgres}@postgres:5432/${POSTGRES_DB:-web_rs_thaiarts}
    ports:
      - "3000:3000"

  migrate:
    image: pichaya5502/web_rs_thaiarts-frontend:latest
    build:
      context: ./frontend
      dockerfile: Dockerfile
      args:
        MODEL_SERVICE_URL: http://backend:8001
    profiles: ["tools"]
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER:-postgres}:${POSTGRES_PASSWORD:-postgres}@postgres:5432/${POSTGRES_DB:-web_rs_thaiarts}
    restart: "no"
    command: ["sh", "-c", "node .db-dist/cli.js migration:run && node .db-dist/cli.js seed"]

volumes:
  postgres_data:
    name: web_rs_thaiarts_postgres_data
  uploads_data:
    name: web_rs_thaiarts_uploads_data
